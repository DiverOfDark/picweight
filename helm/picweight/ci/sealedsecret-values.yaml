# PRD §13: `helm template` must render cleanly with additionalObjects carrying a
# SealedSecret — proving the sealed-secrets backend is not baked into the chart,
# only supplied by the user.
#
# Exercised by `helm template` in CI. Both entries reference chart helpers
# through `tpl`, and neither values.yaml nor any template mentions
# bitnami.com/v1alpha1.
ingress:
  enabled: true
  className: nginx
  host: picweight.ci.example.com
  tls:
    - hosts: [picweight.ci.example.com]
      secretName: picweight-tls

additionalObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: '{{ include "picweight.fullname" $ }}-oidc'
      labels:
        # Values files are parsed as YAML before `tpl` ever sees them, so an
        # action must be quoted and cannot start a line bare.
        app.kubernetes.io/name: '{{ include "picweight.name" $ }}'
        app.kubernetes.io/instance: '{{ $.Release.Name }}'
    spec:
      encryptedData:
        client_id: AgBvA6rGF9uOIDCCLIENTID...
        client_secret: AgCTr1kQm2OIDCCLIENTSECRET...
        mobile_client_id: AgAlN0pXz3ANDROIDCLIENTID...
      template:
        metadata:
          name: '{{ include "picweight.fullname" $ }}-oidc'

  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: '{{ include "picweight.fullname" $ }}-openai'
    spec:
      encryptedData:
        api_key: AgBy3i4OJSWKOPENAIKEY...
      template:
        metadata:
          name: '{{ include "picweight.fullname" $ }}-openai'

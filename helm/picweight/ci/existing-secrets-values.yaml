# PRD §13, third case: `additionalObjects: []` plus pre-existing Secrets created
# by hand (`kubectl create secret generic ...`). No operator at all.
#
# Also exercises the non-default paths: an out-of-band PVC, a Secret whose keys
# are named differently, and a web-only OIDC Secret with no mobile client.
additionalObjects: []

oidc:
  issuer: https://zitadel.homelab.internal
  existingSecret: picweight-zitadel
  clientIdKey: PICWEIGHT_CLIENT_ID
  clientSecretKey: PICWEIGHT_CLIENT_SECRET
  # Web-only deployment: no Android public client. The env var is dropped
  # entirely rather than referencing a key that will never exist.
  mobileClientIdKey: ""
  redirectUri: https://picweight.homelab.internal/api/auth/callback

openai:
  existingSecret: picweight-openai
  apiKeyKey: OPENAI_API_KEY
  model: gpt-4.1-mini
  baseUrl: http://litellm.ai.svc.cluster.local:4000/v1

persistence:
  existingClaim: picweight-data-nvme

picweight:
  rustLog: "info,picweight_backend::agent=debug"
  webSearchEnabled: true

image:
  tag: sha-abc1234

extraEnv:
  - name: TZ
    value: Europe/Moscow

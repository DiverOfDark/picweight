# PRD §13: the same chart, the same values contract, a different secrets
# backend — here External Secrets Operator pulling from OpenBao. Nothing in the
# chart changes; only additionalObjects does. That is the proof that neither
# backend is hardcoded (goal G8).
ingress:
  enabled: true
  className: nginx
  host: picweight.ci.example.com

additionalObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: '{{ include "picweight.fullname" $ }}-oidc'
      labels:
        # Values files are parsed as YAML before `tpl` ever sees them, so an
        # action must be quoted and cannot start a line bare.
        app.kubernetes.io/name: '{{ include "picweight.name" $ }}'
        app.kubernetes.io/instance: '{{ $.Release.Name }}'
    spec:
      secretStoreRef:
        name: openbao-store
        kind: ClusterSecretStore
      refreshInterval: 1h
      target:
        name: '{{ include "picweight.fullname" $ }}-oidc'
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: client_id
          remoteRef:
            key: zitadel/picweight-credentials
            property: client_id
        - secretKey: client_secret
          remoteRef:
            key: zitadel/picweight-credentials
            property: client_secret
        # The Android app is a public (native) client — only a client_id exists.
        - secretKey: mobile_client_id
          remoteRef:
            key: zitadel/picweight_android-credentials
            property: client_id

  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: '{{ include "picweight.fullname" $ }}-openai'
    spec:
      secretStoreRef:
        name: openbao-store
        kind: ClusterSecretStore
      refreshInterval: 1h
      target:
        name: '{{ include "picweight.fullname" $ }}-openai'
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: api_key
          remoteRef:
            key: openai/picweight
            property: api_key

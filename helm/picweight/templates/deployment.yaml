apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "picweight.fullname" . }}
  labels:
    {{- include "picweight.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 600
  # Single replica over a ReadWriteOnce PVC holding one SQLite file: Recreate
  # avoids the new pod deadlocking on the volume while the old one still holds
  # it, and avoids two writers on the same WAL.
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      {{- include "picweight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "picweight.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: picweight-data
          persistentVolumeClaim:
            claimName: {{ include "picweight.dataClaimName" . }}
      containers:
        - name: picweight
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.picweight.port }}
              protocol: TCP
          env:
            - name: PICWEIGHT_PORT
              value: {{ .Values.picweight.port | quote }}
            - name: PICWEIGHT_DATA_PATH
              value: {{ .Values.picweight.dataPath | quote }}

            # --- OIDC ---------------------------------------------------------
            # Credentials come from a Secret this chart references but never
            # creates (PRD §10). Supply it via additionalObjects or out-of-band.
            - name: PICWEIGHT_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: PICWEIGHT_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "picweight.oidcSecretName" . }}
                  key: {{ .Values.oidc.clientIdKey }}
            - name: PICWEIGHT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "picweight.oidcSecretName" . }}
                  key: {{ .Values.oidc.clientSecretKey }}
            {{- if .Values.oidc.mobileClientIdKey }}
            # Public/native client for the Android app: PKCE, no secret.
            # optional so a web-only Secret still starts the pod.
            - name: PICWEIGHT_OIDC_MOBILE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "picweight.oidcSecretName" . }}
                  key: {{ .Values.oidc.mobileClientIdKey }}
                  optional: true
            {{- end }}
            - name: PICWEIGHT_OIDC_REDIRECT_URI
              value: {{ include "picweight.oidcRedirectUri" . | quote }}
            - name: PICWEIGHT_OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}

            # --- OpenAI -------------------------------------------------------
            # §7: the key lives only in the backend. Clients never see it.
            - name: PICWEIGHT_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "picweight.openaiSecretName" . }}
                  key: {{ .Values.openai.apiKeyKey }}
            {{- with .Values.openai.model }}
            - name: PICWEIGHT_OPENAI_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.openai.baseUrl }}
            - name: PICWEIGHT_OPENAI_BASE_URL
              value: {{ . | quote }}
            {{- end }}

            # --- Misc ---------------------------------------------------------
            - name: PICWEIGHT_JWT_TTL
              value: {{ .Values.picweight.jwtTtl | quote }}
            - name: PICWEIGHT_WEB_SEARCH_ENABLED
              value: {{ .Values.picweight.webSearchEnabled | quote }}
            - name: RUST_LOG
              value: {{ .Values.picweight.rustLog | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: picweight-data
              mountPath: {{ .Values.picweight.dataPath }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

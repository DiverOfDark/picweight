name: Rust, Vue & Android CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  # The API contract is generated, never hand-written: `android/openapi.json`
  # comes from the Rust types, the Android Retrofit client and the web client's
  # enums both come from it. This job fails if the committed generated output
  # has drifted from what the current spec produces.
  #
  # It exists because a spec that lied about its own enum casing
  # (`Sex: ["Male","Female"]` against a server accepting `male`/`female`) broke
  # every enum-valued write in the web client, silently, for a whole release.
  # The backend has its own guard, `enum_wire_values_match_the_openapi_schema`;
  # this is the client-side half.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web deps
        working-directory: frontend
        run: npm ci

      - name: Generated client is in sync with the spec
        working-directory: frontend
        run: npm run check:generated

      - name: Web build
        working-directory: frontend
        run: npm run build

  # The Rust and Vue builds are not repeated here: the Dockerfile runs
  # `cargo test --release` (PRD §10) and `npm run build` inside the image, so
  # the `docker` job below is the backend/frontend gate. This job exists to get
  # a standalone debug+release APK pair out of a tagged build.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The Android versionCode is `git rev-list --count HEAD`, and
          # actions/checkout defaults to a depth-1 clone, where that count is 1 on
          # every single build. The in-app updater would then compare 1 against 1
          # and answer "up to date" forever — the exact failure this versioning
          # scheme exists to prevent. Full history is not optional here.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Must agree with the `docker` job below: an APK from here and an APK from
      # the image have to describe themselves identically, or "is the server
      # newer?" becomes a coin toss. The docker job keeps the leading `v` in
      # PICWEIGHT_VERSION and the Dockerfile strips it, so both end at `1.2.3`.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            # Not a release, so do not claim to be one. `master+<short-sha>` is
            # honest and unique per build; the old empty value meant Gradle fell
            # back to its "1.0.0" default.
            name="${GITHUB_REF_NAME}+$(git rev-parse --short HEAD)"
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"
          # Monotonic on master, unlike anything derived from tags.
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # The Retrofit client is generated from the committed android/openapi.json,
      # so this also compiles the API contract (PRD §13 contract-drift guard).
      # The image build regenerates that spec from the binary it ships.
      #
      # Both properties are passed unconditionally. Passing only -PversionName —
      # as this job used to — left versionCode at Gradle's fallback of 1, so an
      # APK published from a tag could never supersede an installed one.
      - name: Build Android APKs
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon \
            "-PversionName=$VERSION_NAME" "-PversionCode=$VERSION_CODE"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Through the environment rather than inline `${{ }}`: the version name
          # embeds a git ref, which is attacker-controlled on a PR.
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Rename release APK for upload
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Gradle emits app-release.apk when signing is configured and
          # app-release-unsigned.apk otherwise. Glob so a tag cut without
          # KEYSTORE_PASSWORD still publishes (unsigned) rather than failing
          # the job on a missing filename — matches the Dockerfile's
          # `app-release*.apk`. Fail loudly if neither exists.
          set -euo pipefail
          out=android/app/build/outputs/apk/release
          apk=$(ls "$out"/app-release*.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no APK produced in $out" >&2
            exit 1
          fi
          case "$apk" in
            *unsigned*) echo "::warning::publishing an UNSIGNED APK — set the KEYSTORE_PASSWORD secret and commit a keystore to sign releases" ;;
          esac
          cp "$apk" "$out/picweight-release.apk"

      # Only tags produce the renamed APK, and only the `release` job — which is
      # itself tag-gated — consumes it. Uploading unconditionally would leave a
      # "no files found" warning on every push and hide a genuinely missing APK.
      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/picweight-release.apk
          if-no-files-found: error
          retention-days: 30

  # PRD §13: the chart must render with the secrets supplied by *any* backend,
  # because it hardcodes none. Three shapes are checked — a SealedSecret, an
  # ExternalSecret, and plain pre-existing Secrets with additionalObjects empty.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: helm lint
        run: |
          set -euo pipefail
          helm lint helm/picweight
          for f in helm/picweight/ci/*-values.yaml; do
            echo "::group::helm lint --values $f"
            helm lint helm/picweight --values "$f"
            echo "::endgroup::"
          done

      - name: helm template
        run: |
          set -euo pipefail
          # Defaults, then each secrets backend. `--dry-run=client` on install
          # additionally renders NOTES.txt, which helm template skips.
          helm template picweight helm/picweight > /dev/null
          helm install picweight helm/picweight --dry-run=client > /dev/null
          for f in helm/picweight/ci/*-values.yaml; do
            echo "::group::helm template --values $f"
            helm template picweight helm/picweight --values "$f"
            helm install picweight helm/picweight --dry-run=client --values "$f" > /dev/null
            echo "::endgroup::"
          done

      # The chart must never emit a Secret of its own (PRD §10). Assert it
      # rather than trust it: a future template that "helpfully" generates one
      # would silently put the OpenAI key into the ArgoCD diff.
      - name: The chart generates no Secret
        run: |
          set -euo pipefail
          for f in helm/picweight helm/picweight/ci/*-values.yaml; do
            if [ "$f" = helm/picweight ]; then
              helm template picweight helm/picweight > rendered.yaml
            else
              helm template picweight helm/picweight --values "$f" > rendered.yaml
            fi
            # additional-objects.yaml is exempt: those manifests are the user's,
            # supplied through values, and a hand-written Secret is a legitimate
            # choice there.
            offenders=$(awk '
              /^# Source: picweight\/templates\//        { src = $3 }
              /^kind: Secret$/ { if (src !~ /additional-objects/) print src }
            ' rendered.yaml | sort -u)
            if [ -n "$offenders" ]; then
              echo "::error::chart template(s) rendered a Secret with $f; PRD §10 forbids it: $offenders"
              exit 1
            fi
          done

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          # See build-android: a shallow clone makes `git rev-list --count HEAD`
          # return 1 forever, and the image would ship an APK that no installed
          # client ever considers newer.
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # The `v` is kept; the Dockerfile strips it for the Android
            # versionName and the backend reports the tag verbatim.
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          # The Android versionCode. Same expression as build-android, so the two
          # jobs cannot disagree about which build is newer.
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Pull requests build the image (so `cargo test --release` still gates the
      # PR) but must not push: GITHUB_TOKEN has no package write from a fork.
      #
      # PICWEIGHT_VERSION_CODE changes on every commit, so the android-builder
      # stage no longer reuses its cached layer across master pushes that leave
      # android/ untouched. That is inherent — the APK's identity has to change
      # when the image's does — and the stage's Gradle cache mount absorbs most of
      # the cost.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PICWEIGHT_VERSION=${{ steps.version.outputs.version }}
            PICWEIGHT_VERSION_CODE=${{ steps.version.outputs.version_code }}
          secrets: |
            keystore_password=${{ secrets.KEYSTORE_PASSWORD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-android, helm, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: picweight ${{ steps.version.outputs.version }}
          body: |
            ## Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            See all tags on [GHCR](https://ghcr.io/${{ github.repository }}).

            ## Helm

            ```bash
            helm upgrade --install picweight ./helm/picweight \
              --set image.tag=${{ steps.version.outputs.version }}
            ```

            The chart references existing Secrets by name and generates none —
            bring your own sealed-secrets, External Secrets or plain `kubectl
            create secret`.

            ## Android

            Download the APK from the assets below, or fetch it from a running
            instance at `/picweight.apk`.
          files: apk/*.apk
          generate_release_notes: true
